name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run path: a fresh fork's workflows start disabled behind an
  # Actions-tab banner (separate from the permissions setting), so the
  # first tag push may never fire. Dispatching by hand re-runs the same
  # build and uploads into the existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish into"
        required: true
        default: "v1.2.0-ventura.1"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build -c release --arch arm64
      - name: Self-test
        run: "$(swift build -c release --arch arm64 --show-bin-path)/removemacai selftest"
      - name: Package
        run: |
          mkdir -p stage dist
          cp "$(swift build -c release --arch arm64 --show-bin-path)/removemacai" LICENSE THIRD-PARTY-NOTICES.md stage/
          COPYFILE_DISABLE=1 tar -czf dist/removemacai-darwin-arm64.tar.gz -C stage removemacai LICENSE THIRD-PARTY-NOTICES.md
          bash tools/build-app.sh
          ditto -c -k --keepParent .build/RemoveMacAI.app dist/RemoveMacAI.zip
          cd dist
          shasum -a 256 removemacai-darwin-arm64.tar.gz > removemacai-darwin-arm64.tar.gz.sha256
          shasum -a 256 RemoveMacAI.zip > RemoveMacAI.zip.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/removemacai-darwin-arm64.tar.gz
            dist/RemoveMacAI.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          version="${TAG#v}"
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          # Fork adaptation: the connector has no tag tool, so the release
          # (and its tag) are created in the web UI first, which triggers
          # this workflow. Upload into that release when it already exists.
          # Manual runs (workflow_dispatch) pass the tag as an input, because
          # a dispatch run's ref is the branch, not the tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md $pre
          fi
